<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>{{PAGE_TITLE}}</title>
<meta property="og:title" content="{{PAGE_TITLE}}">
<meta property="og:description" content="CountShare 极简文件分享">
<style>
* { margin:0; padding:0; box-sizing:border-box; }
body { font-family:-apple-system,BlinkMacSystemFont,"Segoe UI","PingFang SC","Microsoft YaHei",sans-serif; background:#fafafa; min-height:100vh; display:flex; align-items:center; justify-content:center; padding:20px; color:#1a1a1a; }
.container { background:white; border:1px solid #eaeaea; border-radius:12px; box-shadow:0 1px 3px rgba(0,0,0,.04), 0 8px 24px rgba(0,0,0,.04); padding:56px 48px; max-width:480px; width:100%; text-align:center; }
.icon { font-size:40px; margin-bottom:20px; }
h1 { font-size:18px; font-weight:600; color:#1a1a1a; margin-bottom:6px; word-break:break-all; line-height:1.4; }
.size { color:#888; font-size:13px; margin-bottom:10px; }
.tags { display:flex; flex-wrap:wrap; gap:6px; justify-content:center; margin-bottom:18px; }
.tag { display:inline-block; background:#f5f5f5; color:#555; font-size:12px; padding:3px 10px; border-radius:6px; }
.count { display:inline-flex; align-items:center; gap:6px; color:#555; font-size:13px; margin-bottom:24px; padding:4px 12px; background:#f5f5f5; border-radius:6px; }
.btn { display:inline-block; background:#2563eb; color:white; padding:12px 40px; border-radius:8px; text-decoration:none; font-size:15px; font-weight:500; transition:background .15s; border:0; cursor:pointer; }
.btn:hover { background:#1d4ed8; }
.footer { margin-top:32px; color:#bbb; font-size:11px; letter-spacing:.5px; }
.multi-list { text-align:left; }
.multi-list .item { display:flex; align-items:center; padding:14px 16px; border:1px solid #eee; border-radius:10px; margin-bottom:10px; }
.multi-list .item .ico { font-size:24px; margin-right:14px; }
.multi-list .item .info { flex:1; min-width:0; }
.multi-list .item .info .name { font-weight:500; font-size:14px; color:#1a1a1a; white-space:nowrap; overflow:hidden; text-overflow:ellipsis; }
.multi-list .item .info .meta { font-size:12px; color:#999; margin-top:2px; }
.multi-list .item .dl-btn { background:#2563eb; color:white; padding:7px 18px; border-radius:7px; text-decoration:none; font-size:13px; font-weight:500; white-space:nowrap; border:0; cursor:pointer; }
/* 密码弹窗 */
.modal-mask { display:none; position:fixed; inset:0; background:rgba(0,0,0,.35); align-items:center; justify-content:center; z-index:999; }
.modal-mask.show { display:flex; }
.modal { background:white; border-radius:12px; padding:28px 26px; width:340px; max-width:92vw; box-shadow:0 12px 40px rgba(0,0,0,.18); text-align:center; }
.modal h3 { font-size:16px; margin-bottom:4px; }
.modal .sub { color:#888; font-size:12px; margin-bottom:16px; word-break:break-all; }
.modal input { width:100%; padding:11px 13px; border:1px solid #ddd; border-radius:8px; font-size:15px; margin-bottom:12px; box-sizing:border-box; }
.modal .err { color:#b91c1c; background:#fef2f2; border:1px solid #fecaca; padding:8px 11px; border-radius:8px; font-size:12px; margin-bottom:12px; text-align:left; display:none; }
.modal .err.show { display:block; }
.modal .row { display:flex; gap:10px; }
.modal .row button { flex:1; }
</style>
</head>
<body>
{{PAGE_CONTENT}}
<script>
function openPwd(id, filename) {
    var mask = document.getElementById('pwd-mask');
    document.getElementById('pwd-filename').textContent = filename;
    document.getElementById('pwd-input').value = '';
    document.getElementById('pwd-err').classList.remove('show');
    mask.dataset.id = id;
    mask.classList.add('show');
    setTimeout(function(){ document.getElementById('pwd-input').focus(); }, 50);
}
function closePwd() { document.getElementById('pwd-mask').classList.remove('show'); }
function submitPwd() {
    var mask = document.getElementById('pwd-mask');
    var id = mask.dataset.id;
    var pwd = document.getElementById('pwd-input').value;
    var err = document.getElementById('pwd-err');
    if (!pwd) { err.textContent = '请输入密码'; err.classList.add('show'); return; }
    fetch('/d/' + id, { method:'POST', headers:{'Content-Type':'application/x-www-form-urlencoded'}, body:'pwd=' + encodeURIComponent(pwd) })
        .then(function(r){
            if (r.ok) { closePwd(); return r.blob(); }
            return r.text().then(function(t){ throw new Error(t); });
        })
        .then(function(blob){
            // 触发下载
            var a = document.createElement('a');
            a.href = URL.createObjectURL(blob);
            a.download = 'download';
            document.body.appendChild(a); a.click(); a.remove();
            setTimeout(function(){ URL.revokeObjectURL(a.href); }, 1000);
        })
        .catch(function(){ err.textContent = '密码错误，请重试'; err.classList.add('show'); });
}
document.getElementById('pwd-input').addEventListener('keydown', function(e){ if(e.key==='Enter') submitPwd(); });
</script>
<div class="modal-mask" id="pwd-mask">
    <div class="modal">
        <h3>🔒 需要密码</h3>
        <p class="sub" id="pwd-filename"></p>
        <div class="err" id="pwd-err"></div>
        <input id="pwd-input" type="password" placeholder="请输入访问密码" autocomplete="off">
        <div class="row">
            <button class="btn" style="background:#eee;color:#333" type="button" onclick="closePwd()">取消</button>
            <button class="btn" type="button" onclick="submitPwd()">确认下载</button>
        </div>
    </div>
</div>
</body>
</html>
