<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>CountShare 管理页</title>
<style>
* { margin:0; padding:0; box-sizing:border-box; }
body { font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,sans-serif; background:#f5f5f5; padding:20px; }
.container { max-width:960px; margin:0 auto; }
h1 { margin-bottom:16px; }
h2 { margin:24px 0 12px; }
table { width:100%; border-collapse:collapse; background:white; border-radius:8px; overflow:hidden; margin-bottom:24px; font-size:14px; }
th, td { padding:10px 8px; text-align:left; border-bottom:1px solid #eee; }
th { background:#f8f9fa; font-weight:600; }
tr:hover { background:#f8f9fa; }
.status-ok { color:green; }
.status-expired { color:red; }
.status-deleted { color:red; }
.btn { padding:5px 12px; border:none; border-radius:4px; cursor:pointer; font-size:12px; margin-right:4px; }
.btn-set { background:#007bff; color:white; }
.btn-log { background:#28a745; color:white; }
.btn-copy { background:#6c757d; color:white; }
.btn-copy.copied { background:#28a745; }
.modal-overlay { position:fixed; top:0; left:0; width:100%; height:100%; background:rgba(0,0,0,0.5); display:flex; align-items:center; justify-content:center; z-index:1000; }
.modal { background:white; padding:24px; border-radius:12px; width:90%; max-width:420px; }
.modal label { display:block; margin:12px 0 4px; font-weight:500; }
.modal input[type="datetime-local"], .modal input[type="number"], .modal input[type="text"] { width:100%; padding:8px; border:1px solid #ddd; border-radius:4px; }
.modal .quick-options { display:flex; gap:6px; flex-wrap:wrap; margin:6px 0 4px; }
.modal .quick-options button { padding:4px 10px; background:#f0f0f0; border:1px solid #ccc; border-radius:4px; cursor:pointer; font-size:12px; }
.modal .quick-options button.active { background:#007bff; color:white; border-color:#007bff; }
.modal .actions { margin-top:16px; display:flex; gap:8px; justify-content:flex-end; }
.modal .actions button { padding:8px 16px; border:none; border-radius:4px; cursor:pointer; }
.modal .actions .save { background:#007bff; color:white; }
.modal .actions .cancel { background:#6c757d; color:white; }
.log-filter { margin-bottom:12px; font-size:14px; }
.log-filter a { color:#007bff; cursor:pointer; margin-left:8px; }
</style>
</head>
<body>
<div class="container">
    <h1>📊 CountShare 管理页</h1>
    <div id="app"></div>
</div>

<script>
const API = '/api/files';
let allFiles = [];
let allLogs = [];
let archived = {};
let filterFile = null;

async function fetchData() {
    const res = await fetch(API);
    return res.json();
}

function formatSize(bytes) {
    if (bytes < 1024) return bytes + ' B';
    if (bytes < 1024 * 1024) return (bytes/1024).toFixed(1) + ' KB';
    return (bytes/1024/1024).toFixed(1) + ' MB';
}

function formatTime(iso) {
    const d = new Date(iso);
    return d.toLocaleString('zh-CN', { timeZone: 'Asia/Shanghai' });
}

function getFileStatus(filename) {
    if (allFiles.some(f => f.filename === filename)) return 'ok';
    if (archived[filename]) return 'expired';
    return 'deleted';
}

function getStatusLabel(filename) {
    const status = getFileStatus(filename);
    if (status === 'ok') return { text: '正常', class: 'status-ok' };
    if (status === 'expired') {
        const reason = archived[filename]?.reason || 'expired';
        const label = reason === 'expired' ? '已过期' : '已用尽';
        return { text: label, class: 'status-expired' };
    }
    return { text: '已删除', class: 'status-deleted' };
}

// ----- 设置弹窗 -----
function showSettings(file) {
    const overlay = document.createElement('div');
    overlay.className = 'modal-overlay';
    overlay.innerHTML = `
        <div class="modal">
            <h3>⚙ 分享设置 - ${file.filename}</h3>
            <label>过期时间（北京时间）</label>
            <div class="quick-options">
                <button data-days="1">1天</button>
                <button data-days="3">3天</button>
                <button data-days="7">7天</button>
                <button data-days="custom">自定义</button>
            </div>
            <input type="datetime-local" id="set-expire" step="60">
            <label>最大下载次数</label>
            <input type="number" id="set-max" min="1" placeholder="留空 = 不限">
            <label>访问密码</label>
            <input type="text" id="set-pwd" placeholder="留空 = 无密码">
            <div class="actions">
                <button class="cancel" onclick="this.closest('.modal-overlay').remove()">取消</button>
                <button class="save" id="save-btn">保存</button>
            </div>
        </div>
    `;
    document.body.appendChild(overlay);

    const expireInput = overlay.querySelector('#set-expire');
    const quickBtns = overlay.querySelectorAll('.quick-options button');

    // 填充现有值
    if (file.expire_at) {
        const dt = file.expire_at.replace(' ', 'T').slice(0, 16);
        expireInput.value = dt;
    }
    if (file.max_downloads) {
        overlay.querySelector('#set-max').value = file.max_downloads;
    }

    // 快捷按钮逻辑（修复时区问题）
    quickBtns.forEach(btn => {
        btn.addEventListener('click', () => {
            const days = parseInt(btn.dataset.days);
            if (isNaN(days)) { // custom
                expireInput.value = '';
                expireInput.focus();
                quickBtns.forEach(b => b.classList.remove('active'));
                return;
            }
            const now = new Date();
            now.setDate(now.getDate() + days);
            // 格式化为 YYYY-MM-DDTHH:mm
            const year = now.getFullYear();
            const month = String(now.getMonth() + 1).padStart(2, '0');
            const day = String(now.getDate()).padStart(2, '0');
            const hours = String(now.getHours()).padStart(2, '0');
            const mins = String(now.getMinutes()).padStart(2, '0');
            const value = `${year}-${month}-${day}T${hours}:${mins}`;
            expireInput.value = value;
            quickBtns.forEach(b => b.classList.remove('active'));
            btn.classList.add('active');
        });
    });

    overlay.querySelector('#save-btn').onclick = async () => {
        const expire = overlay.querySelector('#set-expire').value;
        const max = overlay.querySelector('#set-max').value;
        const pwd = overlay.querySelector('#set-pwd').value;
        const formData = new URLSearchParams();
        formData.append('id', file.id);
        if (expire) formData.append('expire_at', expire);
        if (max) formData.append('max_downloads', max);
        if (pwd) formData.append('password', pwd);
        await fetch('/api/settings', { method: 'POST', body: formData });
        overlay.remove();
        render();
    };
}

// ----- 复制链接（带反馈） -----
async function copyLink(id, btnElement) {
    const url = window.location.origin + '/d/' + id;
    try {
        await navigator.clipboard.writeText(url);
        btnElement.innerText = '✅ 已复制';
        btnElement.classList.add('copied');
        setTimeout(() => {
            btnElement.innerText = '🔗 复制链接';
            btnElement.classList.remove('copied');
        }, 2000);
    } catch (e) {
        alert('复制失败，请手动复制链接：' + url);
    }
}

// ----- 渲染 -----
function render() {
    const filesHtml = `
        <table>
            <tr><th>文件名</th><th>大小</th><th>状态</th><th>有效期</th><th>密码</th><th>下载情况</th><th>操作</th></tr>
            ${allFiles.map(f => `
                <tr>
                    <td>${f.filename}</td>
                    <td>${formatSize(f.filesize)}</td>
                    <td class="status-ok">正常</td>
                    <td>${f.expire_at || '无'}</td>
                    <td>${f.password_set ? '🔒 已设' : '无'}</td>
                    <td>${f.download_count} / ${f.max_downloads ? f.max_downloads : '∞'}</td>
                    <td>
                        <button class="btn btn-set" onclick='showSettings(${JSON.stringify(f).replace(/'/g, "&#39;")})'>⚙ 设置</button>
                        <button class="btn btn-log" onclick="filterFile='${f.filename}';render()">📋 日志</button>
                        <button class="btn btn-copy" onclick="copyLink('${f.id}', this)">🔗 复制链接</button>
                    </td>
                </tr>
            `).join('')}
        </table>
    `;

    const filteredLogs = filterFile ? allLogs.filter(l => l.file === filterFile) : allLogs;
    const logsHtml = `
        <h2>📋 下载记录</h2>
        <div class="log-filter">
            ${filterFile ? `正在查看：<strong>${filterFile}</strong> <a onclick="filterFile=null;render()">显示全部</a>` : '显示全部'}
        </div>
        <table>
            <tr><th>时间</th><th>文件</th><th>IP</th><th>浏览器</th></tr>
            ${filteredLogs.map(l => {
                const status = getStatusLabel(l.file);
                const statusText = status.text !== '正常' ? ` [${status.text}]` : '';
                const color = status.class === 'status-ok' ? 'inherit' : 'red';
                return `<tr>
                    <td>${formatTime(l.time)}</td>
                    <td style="color:${color};font-weight:${status.text!=='正常'?'bold':'normal'}">${l.file}${statusText}</td>
                    <td>${l.ip}</td>
                    <td>${l.ua ? l.ua.substring(0, 50) : ''}</td>
                </tr>`;
            }).join('')}
        </table>
    `;

    document.getElementById('app').innerHTML = filesHtml + logsHtml;
}

fetchData().then(data => {
    allFiles = data.files || [];
    allLogs = data.logs || [];
    archived = data.archived || {};
    render();
});
</script>
</body>
</html>
