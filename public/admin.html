<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>下载详情 - CountShare</title>
<style>
* { margin:0; padding:0; box-sizing:border-box; }
body { font-family:-apple-system,BlinkMacSystemFont,"Segoe UI","PingFang SC",sans-serif; background:#fafafa; padding:30px 18px; color:#1a1a1a; }
.container { max-width:960px; margin:0 auto; }
h2 { font-size:15px; font-weight:600; color:#333; margin:0 0 12px 4px; }
.panel { background:white; border:1px solid #eaeaea; border-radius:10px; padding:20px; margin-bottom:18px; overflow-x:auto; }
table { width:100%; border-collapse:collapse; }
th,td { padding:9px 11px; border-bottom:1px solid #f3f3f3; font-size:13px; text-align:left; }
th { background:#fafafa; color:#666; font-weight:500; font-size:12px; text-transform:uppercase; letter-spacing:.5px; }
tr:last-child td { border-bottom:none; }
.red { color:#b91c1c; }
.empty { color:#bbb; font-size:13px; padding:10px 0; }
.ua { max-width:300px; word-break:break-all; font-size:11px; color:#999; }
.linkbtn { background:transparent; border:0; color:#2563eb; cursor:pointer; font-size:13px; padding:2px 6px; }
.linkbtn:hover { text-decoration:underline; }
/* 设置弹窗 */
.modal-mask { display:none; position:fixed; inset:0; background:rgba(0,0,0,.35); align-items:center; justify-content:center; z-index:999; }
.modal-mask.show { display:flex; }
.modal { background:white; border-radius:12px; padding:24px; width:400px; max-width:92vw; box-shadow:0 12px 40px rgba(0,0,0,.18); }
.modal h3 { font-size:16px; margin-bottom:14px; }
.modal label { display:block; font-size:13px; color:#444; margin-bottom:4px; margin-top:12px; }
.modal input[type=text], .modal input[type=number], .modal input[type=datetime-local] { width:100%; padding:9px 11px; border:1px solid #ddd; border-radius:8px; font-size:14px; box-sizing:border-box; }
.modal small { color:#999; font-size:11px; }
.modal .row { display:flex; gap:10px; margin-top:20px; }
.modal .row button { flex:1; padding:10px; border-radius:8px; border:0; font-size:14px; font-weight:500; cursor:pointer; }
.modal .row .save { background:#2563eb; color:white; }
.modal .row .cancel { background:#eee; color:#333; }
</style>
</head>
<body>
<div class="container">
    <div class="panel">
        <h2>文件总览</h2>
        {{FILE_ROWS}}
    </div>
    <div class="panel">
        <h2>下载记录 <span id="filter-tag" style="font-size:12px;color:#2563eb;display:none;"></span> <button class="linkbtn" id="clear-filter" style="display:none" onclick="clearFilter()">显示全部</button></h2>
        {{LOG_ROWS}}
    </div>
</div>
<div class="modal-mask" id="set-mask">
    <div class="modal">
        <h3>⚙ 分享设置</h3>
        <div id="set-filename" style="font-size:12px;color:#888;margin-bottom:6px;word-break:break-all;"></div>
        <label>过期时间（北京时间）</label>
        <input type="datetime-local" id="set-expire" step="60">
        <small>留空 = 永不过期</small>
        <label>最大下载次数</label>
        <input type="number" id="set-max" min="1" placeholder="留空 = 不限">
        <small>达到次数后文件移到 _expired 目录</small>
        <label>访问密码</label>
        <input type="text" id="set-pwd" placeholder="留空 = 无密码">
        <small>每次下载均需输入，不设 cookie</small>
        <div class="row">
            <button class="cancel" type="button" onclick="closeSet()">取消</button>
            <button class="save" type="button" onclick="saveSet()">保存设置</button>
        </div>
    </div>
</div>
<script>
var ALL_FILES = {};
function openSet(id) {
    var mask = document.getElementById('set-mask');
    var f = ALL_FILES[id];
    document.getElementById('set-filename').textContent = f ? f.filename : '';
    // 加载当前 meta
    fetch('/api/settings', {method:'POST', headers:{'Content-Type':'application/json'}, body:JSON.stringify({id:id})})
        .then(function(r){ return r.json(); }).then(function(d){
            var m = d.meta || {};
            document.getElementById('set-expire').value = (m.expire_at ? m.expire_at.replace(' ','T').replace(':00','') : '');
            document.getElementById('set-max').value = (m.max_downloads ? m.max_downloads : '');
            document.getElementById('set-pwd').value = (m.password ? m.password : '');
            mask.dataset.id = id;
            mask.classList.add('show');
        }).catch(function(){ mask.dataset.id = id; mask.classList.add('show'); });
}
function closeSet() { document.getElementById('set-mask').classList.remove('show'); }
function saveSet() {
    var mask = document.getElementById('set-mask');
    var id = mask.dataset.id;
    var exp = document.getElementById('set-expire').value; // YYYY-MM-DDTHH:mm
    var max = document.getElementById('set-max').value;
    var pwd = document.getElementById('set-pwd').value;
    // 组装 expire_at 为 YYYY-MM-DD HH:mm:ss（北京时间）
    var expire_at = '';
    if (exp) { expire_at = exp.replace('T',' ') + ':00'; }
    fetch('/api/settings', {method:'POST', headers:{'Content-Type':'application/json'}, body:JSON.stringify({id:id, expire_at:expire_at, max_downloads:max, password:pwd})})
        .then(function(r){ return r.json(); }).then(function(d){
            if (d.ok) { closeSet(); location.reload(); }
        });
}
function filterLog(fid) {
    var rows = document.querySelectorAll('#logtable tr[data-fid]');
    var tag = document.getElementById('filter-tag');
    var btn = document.getElementById('clear-filter');
    rows.forEach(function(r){ r.style.display = (r.dataset.fid === fid) ? '' : 'none'; });
    var f = ALL_FILES[fid];
    tag.textContent = f ? '（仅显示：' + f.filename + '）' : '';
    tag.style.display = '';
    btn.style.display = '';
}
function clearFilter() {
    var rows = document.querySelectorAll('#logtable tr[data-fid]');
    rows.forEach(function(r){ r.style.display = ''; });
    document.getElementById('filter-tag').style.display = 'none';
    document.getElementById('clear-filter').style.display = 'none';
}
// 收集文件信息供筛选使用
document.querySelectorAll('table').forEach(function(t){
    if (!t.querySelector('th')) return;
    var ths = t.querySelectorAll('th'); if (!ths.length) return;
});
</script>
</body>
</html>
