name: Add Version Tag to Existing Image

on:
  workflow_dispatch:

permissions:
  packages: write
  contents: read

jobs:
  add-tag:
    runs-on: ubuntu-latest
    steps:
      - name: Add 1.2 and v1.2 tags to latest image
        uses: shrink/actions-docker-registry-tag@v4
        with:
          registry: ghcr.io
          repository: wallechfox/countshare
          target: latest
          tags: |
            1.2
            v1.2
